{% extends "base.html" %}
{% block title %}Joke{% endblock %}
{% block content %}
<section class="rounded-2xl border border-slate-200 bg-white p-8 shadow-sm">
    <div class="flex items-center gap-3">
        <span class="flex h-10 w-10 items-center justify-center rounded-full bg-amber-100 text-xl">😄</span>
        <h1 class="text-2xl font-bold tracking-tight text-slate-900">Joke</h1>
    </div>
    <pre class="mt-6 whitespace-pre-wrap rounded-xl border border-amber-200 bg-amber-50 p-5 font-mono text-sm leading-relaxed text-slate-800">{{ joke }}</pre>
    <div class="mt-6 flex flex-wrap gap-2">
        <a class="btn-primary" href="/random_joke">Another Random Joke</a>
        <a class="btn" href="/specific_joke">Specific Joke</a>
        <a class="btn" href="/country">Search Country</a>
    </div>
</section>
{% endblock %}
