{% extends "base.html" %}
{% block title %}Specific Joke Form{% endblock %}
{% block content %}
<section class="mx-auto max-w-xl rounded-2xl border border-slate-200 bg-white p-8 shadow-sm">
    <div class="flex items-center gap-3">
        <span class="flex h-10 w-10 items-center justify-center rounded-full bg-amber-100 text-xl">🎯</span>
        <h1 class="text-2xl font-bold tracking-tight text-slate-900">Get a Specific Joke</h1>
    </div>
    <form method="POST" class="mt-6 space-y-5">
        <div>
            <label for="amount">Number of Jokes:</label>
            <input type="number" id="amount" name="amount" class="field" min="1" required>
        </div>

        <div>
            <label for="language">Language:</label>
            <select id="language" name="language" class="field">
                <option value="english">English</option>
                <option value="czech">Czech</option>
                <option value="german">German</option>
                <option value="spanish">Spanish</option>
                <option value="french">French</option>
            </select>
        </div>

        <div>
            <label for="category">Category:</label>
            <select id="category" name="category" class="field">
                <option value="Programming">Programming</option>
                <option value="Misc">Misc</option>
                <option value="Dark">Dark</option>
                <option value="Pun">Pun</option>
                <option value="Spooky">Spooky</option>
                <option value="Christmas">Christmas</option>
            </select>
        </div>

        <button type="submit" class="btn-primary w-full">Get Joke</button>
    </form>
</section>
{% endblock %}
