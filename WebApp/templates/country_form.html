{% extends "base.html" %}
{% block title %}Country Search{% endblock %}
{% block content %}
<section class="mx-auto max-w-xl rounded-2xl border border-slate-200 bg-white p-8 shadow-sm">
    <div class="flex items-center gap-3">
        <span class="flex h-10 w-10 items-center justify-center rounded-full bg-amber-100 text-xl">🌍</span>
        <h1 class="text-2xl font-bold tracking-tight text-slate-900">Search for a Country</h1>
    </div>
    <form method="POST" class="mt-6 space-y-5">
        <div>
            <label for="search_type">Search by:</label>
            <select id="search_type" name="search_type" class="field" required>
                <option value="name">Name</option>
                <option value="currency">Currency</option>
                <option value="language">Language</option>
                <option value="capital">Capital City</option>
            </select>
        </div>
        <div>
            <label for="search_term">Search term:</label>
            <input type="text" id="search_term" name="search_term" class="field" required>
        </div>
        <button type="submit" class="btn-primary w-full">Search</button>
    </form>
</section>
{% endblock %}
