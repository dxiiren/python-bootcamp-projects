{% extends "base.html" %}
{% block title %}Error{% endblock %}
{% block content %}
<section class="mx-auto max-w-xl rounded-2xl border border-rose-200 bg-white p-8 text-center shadow-sm">
    <div class="mx-auto mb-4 flex h-14 w-14 items-center justify-center rounded-full bg-rose-100 text-2xl">⚠️</div>
    <h1 class="text-2xl font-bold tracking-tight text-rose-700">Error</h1>
    <p class="mx-auto mt-2 max-w-md text-slate-600">{{ error_message }}</p>
    <div class="mt-6 flex flex-wrap justify-center gap-2">
        <a class="btn" href="/random_joke">Random Joke</a>
        <a class="btn" href="/specific_joke">Specific Joke</a>
        <a class="btn" href="/country">Search Country</a>
    </div>
</section>
{% endblock %}
